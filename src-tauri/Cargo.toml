[package]
name = "r2-list"
version = "0.0.1"
description = "A desktop workspace for Cloudflare R2 directory URL management"
authors = ["R2 List"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "r2_list_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
remotefs = { version = "1", features = ["tokio"] }
remotefs-smb = { version = "1", default-features = false, features = ["smb"] }
remotefs-webdav = { version = "1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
