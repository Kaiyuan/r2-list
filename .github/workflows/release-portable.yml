name: Portable Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
            macos_architecture: arm64
            macos_deployment_target: ""
          # Catalina (10.15) is Intel-only, so the legacy build needs an x64 runner.
          - platform: macos-x64-10.15
            os: macos-15-intel
            macos_architecture: x64
            macos_deployment_target: "10.15"
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y visualstudio2022buildtools --package-parameters "--includeRecommended --add Microsoft.VisualStudio.Workload.NativeDesktop --passive --locale en-US"
          winget install --id Microsoft.EdgeWebView2Runtime --exact --silent --accept-source-agreements --accept-package-agreements --disable-interactivity || exit 0

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select --install || true
          brew install pkg-config

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config \
            libxdo-dev libssl-dev libgtk-3-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            patchelf libfuse2t64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows portable artifact
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/build-portable-windows.ps1

      - name: Build macOS portable artifact
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: bash scripts/build-portable-macos.sh "${{ matrix.macos_architecture }}" "${{ matrix.macos_deployment_target }}"

      - name: Build Linux portable artifact
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: bash scripts/build-portable-linux.sh "${{ matrix.platform == 'linux-x64' && 'x64' || 'arm64' }}"

      - name: Add version to Windows archive name
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $source = "artifacts/portable/r2-list-windows-x64.zip"
          $destination = "artifacts/portable/r2-list-windows-x64-$env:GITHUB_REF_NAME.zip"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected build artifact was not found: $source"
          }
          Move-Item -LiteralPath $source -Destination $destination

      - name: Add version to macOS archive name
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          shopt -s nullglob
          archives=(artifacts/portable/r2-list-macos-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS archive, found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          mv "$archive" "${archive%.zip}-${GITHUB_REF_NAME}.zip"

      - name: Add version to Linux package name
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          arch="${{ matrix.platform == 'linux-x64' && 'x64' || 'arm64' }}"
          source="artifacts/portable/r2-list-linux-${arch}.AppImage"
          destination="artifacts/portable/r2-list-linux-${arch}-${GITHUB_REF_NAME}.AppImage"
          if [[ ! -f "$source" ]]; then
            echo "Expected build artifact was not found: $source" >&2
            exit 1
          fi
          mv "$source" "$destination"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ github.ref_name }}
          path: artifacts/portable/*-${{ github.ref_name }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach assets to tag Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*