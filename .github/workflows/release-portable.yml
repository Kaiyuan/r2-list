name: Portable Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libxdo-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev patchelf libfuse2t64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows portable artifact
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/build-portable-windows.ps1

      - name: Build macOS portable artifact
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/build-portable-macos.sh

      - name: Build Linux portable artifact
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: bash scripts/build-portable-linux.sh

      - name: Add version to Windows archive name
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $source = "artifacts/portable/r2-list-windows-x64.zip"
          $destination = "artifacts/portable/r2-list-windows-x64-$env:GITHUB_REF_NAME.zip"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected build artifact was not found: $source"
          }
          Move-Item -LiteralPath $source -Destination $destination

      - name: Add version to macOS archive name
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          shopt -s nullglob
          archives=(artifacts/portable/r2-list-macos-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS archive, found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          mv "$archive" "${archive%.zip}-${GITHUB_REF_NAME}.zip"

      - name: Add version to Linux package name
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          source="artifacts/portable/r2-list-linux-x64.AppImage"
          destination="artifacts/portable/r2-list-linux-x64-${GITHUB_REF_NAME}.AppImage"
          if [[ ! -f "$source" ]]; then
            echo "Expected build artifact was not found: $source" >&2
            exit 1
          fi
          mv "$source" "$destination"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ github.ref_name }}
          path: artifacts/portable/*-${{ github.ref_name }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach assets to tag Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*